name: Sample

# Posts a summary built from fake reports (scripts/sample-reports.js), to
# preview the output without running a real test suite.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sample.yml
      - scripts/sample-reports.js

permissions:
  contents: write # test matrix image on the assets branch
  actions: read

jobs:
  sample:
    name: Sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample reports
        run: node scripts/sample-reports.js report

      - name: Post summary
        uses: ./
        with:
          title: Tests (sample)
          reports: report/**/*.xml
          pr-comment: false
          image-branch: test-summary-assets
          image-repository: cedana/summaries
          image-token: ${{ secrets.GIT_CI_PAT }}
          matrix-sections: |
            Kubernetes=^Kubernetes
            SLURM=^Slurm
            Other
          matrix-split: |
            CPU
            CUDA=\b(CUDA|GPU)\b
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_TEST_ONLY }}

      # The release summary picks up the test matrix from the artifact uploaded above.
      - name: Post release summary
        id: release-summary
        uses: cedana/cedana-publish-summary@v1
        with:
          title: cedana-test-summary (sample)
          step-summary: false
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_TEST_ONLY }}

      - name: Check the release summary embeds the test matrix
        env:
          PAYLOAD: ${{ steps.release-summary.outputs.payload }}
        run: jq -e '.blocks[] | select(.type == "image")' <<< "$PAYLOAD"
