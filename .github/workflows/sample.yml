name: Sample

# Posts a summary built from fake reports (scripts/sample-reports.js), to
# preview the output without running a real test suite.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sample.yml
      - scripts/sample-reports.js

permissions:
  contents: write # test matrix image on the assets branch
  actions: read

jobs:
  sample:
    name: Sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample reports
        run: node scripts/sample-reports.js report

      - name: Post summary
        uses: ./
        with:
          title: Tests (sample)
          reports: report/**/*.xml
          pr-comment: false
          image-branch: test-summary-assets
          matrix-sections: |
            Kubernetes=^Kubernetes
            SLURM=^Slurm
            Other
          matrix-split: |
            CPU
            CUDA=\b(CUDA|GPU)\b
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_TEST_ONLY }}
